version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # TypeScript 7 drops the `typescript/lib/tsc` subpath export; vue-tsc and the
      # build chain are not compatible yet. Revisit manually when tooling catches up.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # vue-router 5 has breaking peer requirements; migrate deliberately, not via bot PR.
      - dependency-name: vue-router
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      pip-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
