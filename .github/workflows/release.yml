name: Publish container

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/mcocdaa/meetflow

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag must be valid SemVer prefixed with v" >&2
            exit 1
          fi
      - name: Verify release tag is reachable from main
        shell: bash
        run: |
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          tag_commit="$(git rev-list -n1 "$GITHUB_REF")"
          if ! git merge-base --is-ancestor "$tag_commit" "origin/main"; then
            echo "Release tag must point to a commit reachable from main" >&2
            exit 1
          fi
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend test
      - run: npm --prefix frontend run build
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Write release evidence
        shell: bash
        run: |
          python scripts/write_release_metadata.py \
            --output-dir release-artifacts \
            --image "$IMAGE_NAME" \
            --release-tag "$GITHUB_REF_NAME" \
            --commit "$GITHUB_SHA" \
            --digest "${{ steps.build.outputs.digest }}" \
            --platforms "linux/amd64,linux/arm64" \
            --tags "${{ steps.metadata.outputs.tags }}"
          docker buildx imagetools inspect "${IMAGE_NAME}@${{ steps.build.outputs.digest }}" \
            > release-artifacts/image-manifest.txt
      - name: Upload release evidence
        uses: actions/upload-artifact@v4
        with:
          name: meetflow-release-${{ github.ref_name }}
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 90
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          release_args=(
            --title "MeetFlow ${GITHUB_REF_NAME}"
            --target "$GITHUB_SHA"
            --notes-file release-artifacts/release-notes.md
          )
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            release_args+=(--prerelease)
          fi
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" "${release_args[@]}"
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" "${release_args[@]}"
          fi
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            release-artifacts/release-metadata.json \
            release-artifacts/image-manifest.txt \
            --clobber
