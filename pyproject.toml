[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "meetflow"
version = "0.3.2"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.20.0,<2",
  "fastapi>=0.141.1,<1",
  "uvicorn[standard]>=0.53.0,<1",
  "sqlalchemy>=2.0.53,<3",
  "pydantic-settings>=2.15.0,<3",
  "pwdlib[argon2]>=0.3.1,<1",
  "itsdangerous>=2.2,<3",
  "cryptography>=50.0.1,<51",
  "jsonschema>=4.26.0,<5",
  "python-multipart>=0.0.32,<1",
  "PyYAML>=6.0.3,<7",
  "httpx>=0.28.1,<1",
]

[project.optional-dependencies]
test = ["pytest>=9.1.1,<10", "httpx>=0.28.1,<1", "setuptools>=84.0.0"]

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

[tool.setuptools.data-files]
"share/meetflow" = ["backend/alembic.ini"]
"share/meetflow/migrations" = [
  "backend/migrations/env.py",
  "backend/migrations/script.py.mako",
]
"share/meetflow/migrations/versions" = [
  "backend/migrations/versions/*.py",
]

[tool.pytest.ini_options]
pythonpath = ["backend", "."]
testpaths = ["backend/tests"]
