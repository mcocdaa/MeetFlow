[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "meetflow"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16,<2",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0,<3",
  "pydantic-settings>=2.7,<3",
  "pwdlib[argon2]>=0.2,<1",
  "itsdangerous>=2.2,<3",
  "cryptography>=44,<47",
  "jsonschema>=4.23,<5",
  "python-multipart>=0.0.20,<1",
  "PyYAML>=6,<7",
  "httpx>=0.28,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.28,<1", "setuptools>=75"]

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

[tool.setuptools.data-files]
"share/meetflow" = ["backend/alembic.ini"]
"share/meetflow/migrations" = [
  "backend/migrations/env.py",
  "backend/migrations/script.py.mako",
]
"share/meetflow/migrations/versions" = [
  "backend/migrations/versions/*.py",
]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
